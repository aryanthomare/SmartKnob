[env:smartknob_driver]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
; ESP32-S3-MINI-1-N8: 8 MB flash, no PSRAM. Native USB CDC for Serial.
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
