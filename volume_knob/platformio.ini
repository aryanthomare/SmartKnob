[env:smartknob_driver]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Uploads go through the chip's USB-Serial/JTAG port (COM3). Once this firmware runs, the board is a
; TinyUSB composite device (303A:4B4E, HID volume + CDC serial) and COM3 is gone. To reflash:
; "Disconnect for firmware update" in the app's tray menu, then open the knob's COM port at 1200 baud
; (reboots into the bootloader on COM3), then upload. Or hold BOOT while plugging in.
; Bluetooth: pair "SmartKnob" once in Windows Settings > Bluetooth. Windows caches the knob's BLE
; services, so after changing them in firmware, remove the device there and pair again.
upload_port = COM3
monitor_speed = 115200
; ESP32-S3-MINI-1-N8: 8 MB flash, no PSRAM.
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_MODE=0
    ; Off so USB starts in setup(), after the firmware sets its own PID (see setup()).
    -DARDUINO_USB_CDC_ON_BOOT=0
